services:
  - type: web
    name: fraud-detection-api
    runtime: python3
    buildCommand: pip install -r requirements-fastapi.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
  - type: web
    name: fraud-detection-streamlit
    runtime: python3
    buildCommand: pip install -r requirements-streamlit.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PORT
        value: 8501